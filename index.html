<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abliterated</title>
<style>
  :root {
    --bg: #f5f4ef; --panel: #ffffff; --text: #1f1e1d; --muted: #6b6a66;
    --border: #e3e1d9; --user: #ebe8de; --accent: #c96442; --code: #f0eee6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624; --panel: #30302e; --text: #ecebe6; --muted: #9b9a95;
      --border: #3e3e3a; --user: #3a3936; --accent: #d97757; --code: #1f1e1d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .ver { color: var(--muted); font-size: 12px; }
  #status { font-size: 13px; color: var(--muted); }
  #status.ok::before { content: "● "; color: #3a9a5b; }
  #status.bad::before { content: "● "; color: #c0392b; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 14px; color: var(--text); background: transparent;
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; cursor: pointer;
  }
  button:hover { background: var(--user); }
  #modelSelect {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; max-width: 320px;
  }

  main { flex: 1; overflow-y: auto; }
  #chat { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; font-size: 22px; }
  .msg { margin: 0 0 22px; overflow-wrap: anywhere; }
  .msg.user {
    background: var(--user); border-radius: 14px; padding: 10px 14px;
    margin-left: auto; width: fit-content; max-width: 85%; white-space: pre-wrap;
  }
  .msg.assistant p { margin: 0 0 10px; }
  .msg pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; }
  .msg code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 14px; }
  .msg pre code { background: none; padding: 0; }
  details.think { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  details.think div { white-space: pre-wrap; border-left: 2px solid var(--border); padding-left: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip {
    font-size: 13px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 2px 8px; display: inline-flex; gap: 6px; align-items: center;
  }
  .chip b { cursor: pointer; font-weight: normal; color: var(--muted); }
  .chip .thumb { height: 18px; border-radius: 3px; vertical-align: middle; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .thumbs .thumb { height: 140px; max-width: 220px; border-radius: 8px; object-fit: contain; }
  .error { color: #c0392b; }

  #composer { max-width: 760px; width: 100%; margin: 0 auto; padding: 8px 16px 6px; }
  #box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 10px 12px; box-shadow: 0 1px 6px rgba(0,0,0,.05);
  }
  #box.drag { border-color: var(--accent); }
  textarea {
    width: 100%; border: 0; outline: 0; resize: none; background: transparent;
    color: var(--text); font: inherit; max-height: 220px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); }
  #send:hover { filter: brightness(1.08); background: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 16px 10px; }

  #docs {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
    align-items: center; justify-content: center; padding: 16px;
  }
  #docs.open { display: flex; }
  #docs .card {
    background: var(--panel); border-radius: 12px; padding: 20px; max-width: 420px; width: 100%;
  }
  #docs table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 10px 0 14px; }
  #docs td { border-bottom: 1px solid var(--border); padding: 6px 4px; }
  #docs td:first-child { color: var(--muted); width: 40%; }
</style>
</head>
<body>

<header>
  <h1>Abliterated</h1>
  <span class="ver" data-stamp="header">v1.7.1</span>
  <select id="modelSelect" title="Velg modell"><option>laster…</option></select>
  <span id="status">sjekker…</span>
  <span class="spacer"></span>
  <button id="aboutBtn">Om</button>
  <button id="newBtn">Ny samtale</button>
</header>

<main id="scroller"><div id="chat"></div></main>

<div id="composer">
  <div id="box">
    <div class="chips" id="pending"></div>
    <textarea id="input" rows="1" placeholder="Skriv en melding… (Enter sender, Shift+Enter ny linje)"></textarea>
    <div class="row">
      <button id="attachBtn" title="Legg ved fil (tekst, kode, PDF, bilde)">📎 Fil</button>
      <input type="file" id="file" multiple hidden>
      <span class="spacer"></span>
      <button id="send">Send</button>
    </div>
  </div>
</div>

<footer data-stamp="footer">Abliterated v1.7.1 · kjører lokalt via Ollama</footer>

<div id="docs">
  <div class="card">
    <strong>Om Abliterated</strong>
    <table>
      <tr><td>Versjon</td><td data-stamp="docs">1.7.1</td></tr>
      <tr><td>Modell</td><td id="docModel">–</td></tr>
      <tr><td>Backend</td><td>Ollama (localhost:11434)</td></tr>
      <tr><td>Vedlegg</td><td>Alt: bilde (→ vision), tekst/kode, PDF, ellers hex-oppsummering</td></tr>
    </table>
    <button id="closeDocs">Lukk</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const KEY = 'qwen-chat';
let messages = [];      // { role, content, text, files, thinking, images?, thumbs? }
let pending = [];       // { name, text } eller { name, image(base64), thumb(dataURL) }
let controller = null;  // AbortController for pågående svar
let visionSet = new Set(); // modeller som kan se bilder

try { messages = JSON.parse(localStorage.getItem(KEY)) || []; } catch { messages = []; }
// Base64-bilder lagres IKKE i historikken (for store) — bare tekst/filnavn beholdes.
const save = () => {
  try {
    const lett = messages.map((m) => { const c = { ...m }; delete c.images; delete c.thumbs; return c; });
    localStorage.setItem(KEY, JSON.stringify(lett));
  } catch {}
};

// --- enkel markdown: kodeblokker, inline-kode, fet, avsnitt ---
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function md(src) {
  const parts = src.split(/```/);
  return parts.map((p, i) => {
    if (i % 2) return '<pre><code>' + esc(p.replace(/^[^\n]*\n/, '')) + '</code></pre>';
    return p.split(/\n{2,}/).filter((x) => x.trim()).map((para) =>
      '<p>' + esc(para)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/\n/g, '<br>') + '</p>').join('');
  }).join('');
}

function render() {
  const chat = $('chat');
  if (!messages.length) { chat.innerHTML = '<div class="empty">Hva kan jeg hjelpe med?</div>'; return; }
  chat.innerHTML = '';
  for (const m of messages) {
    const el = document.createElement('div');
    el.className = 'msg ' + m.role;
    if (m.role === 'user') {
      let head = '';
      if (m.files && m.files.length) head += '<div class="chips">' + m.files.map((f) => '<span class="chip">📄 ' + esc(f) + '</span>').join('') + '</div>';
      if (m.thumbs && m.thumbs.length) head += '<div class="thumbs">' + m.thumbs.map((t) => '<img class="thumb" src="' + t + '">').join('') + '</div>';
      el.innerHTML = head;
      el.appendChild(document.createTextNode(m.text));
    } else {
      let html = '';
      if (m.thinking) html += '<details class="think"><summary>Tenkte</summary><div>' + esc(m.thinking) + '</div></details>';
      html += m.error ? '<p class="error">' + esc(m.error) + '</p>' : md(m.content || '…');
      el.innerHTML = html;
    }
    chat.appendChild(el);
  }
  $('scroller').scrollTop = $('scroller').scrollHeight;
}

function renderPending() {
  $('pending').innerHTML = pending.map((f, i) =>
    '<span class="chip">' + (f.image ? '<img class="thumb" src="' + f.thumb + '"> ' : '📄 ') + esc(f.name) + ' <b data-i="' + i + '">✕</b></span>').join('');
}
$('pending').onclick = (e) => { if (e.target.dataset.i) { pending.splice(+e.target.dataset.i, 1); renderPending(); } };

let pdfjsLib = null;
async function loadPdfjs() {
  if (!pdfjsLib) {
    pdfjsLib = await import('/vendor/pdf.min.mjs');
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.min.mjs';
  }
  return pdfjsLib;
}

async function readPdf(f) {
  const pdfjs = await loadPdfjs();
  const buf = new Uint8Array(await f.arrayBuffer());
  const doc = await pdfjs.getDocument({ data: buf }).promise;
  let out = '';
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    out += '--- side ' + p + ' ---\n' + content.items.map((i) => i.str).join(' ') + '\n';
  }
  return out;
}

const CTX_CHARS = 16384 * 3.5; // omtrentlig: kontekstvinduet i tegn (server bruker num_ctx 16384)

// Les en bildefil som base64 (uten data:-prefiks) + dataURL til miniatyr.
function readImage(f) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => { const url = r.result; resolve({ image: String(url).split(',')[1], thumb: String(url) }); };
    r.onerror = reject;
    r.readAsDataURL(f);
  });
}

// Formater Ollama leser direkte. Alt annet (avif, heic …) tegnes om til PNG.
const OLLAMA_IMG = /\.(png|jpe?g|gif|webp|bmp)$/i;
function imageFileToPng(f) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        const d = c.toDataURL('image/png');
        URL.revokeObjectURL(url);
        resolve({ image: d.split(',')[1], thumb: d });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('kunne ikke dekode bildet')); };
    img.src = url;
  });
}

// Alt som verken er tekst, bilde eller PDF → en hex-/byte-oppsummering modellen kan resonnere om.
async function fileToHexSummary(f) {
  const buf = new Uint8Array(await f.arrayBuffer());
  const n = Math.min(buf.length, 512);
  const lines = [];
  let hex = '', ascii = '';
  for (let i = 0; i < n; i++) {
    hex += buf[i].toString(16).padStart(2, '0') + ' ';
    ascii += (buf[i] >= 32 && buf[i] < 127) ? String.fromCharCode(buf[i]) : '.';
    if ((i + 1) % 16 === 0) { lines.push(hex.trim().padEnd(48) + '  ' + ascii); hex = ''; ascii = ''; }
  }
  if (hex) lines.push(hex.trim().padEnd(48) + '  ' + ascii);
  const head = new TextDecoder('latin1').decode(buf.slice(0, Math.min(buf.length, 8192)));
  const sig = [];
  if (head.startsWith('%PDF')) sig.push('PDF');
  if (buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4e && buf[3] === 0x47) sig.push('PNG');
  if (buf[0] === 0xff && buf[1] === 0xd8) sig.push('JPEG');
  if (head.includes('PK\x03\x04')) sig.push('ZIP');
  if (head.startsWith('RIFF')) sig.push('RIFF (WAV/AVI)');
  if (buf[0] === 0x7f && head.slice(1, 4) === 'ELF') sig.push('ELF (Linux-binær)');
  if (buf[0] === 0x4d && buf[1] === 0x5a) sig.push('MZ (Windows-binær)');
  if (head.includes('ftyp')) sig.push('ISO-media (mp4/heic/avif …)');
  return 'Binær fil: ' + f.name + '\nStørrelse: ' + buf.length + ' byte\nGjenkjente signaturer: ' + (sig.join(', ') || 'ingen') +
    '\n\nFørste ' + n + ' byte (hex + ascii):\n' + lines.join('\n');
}

// Rendrer PDF-sider til PNG-bilder (for PDF-er uten tekstlag). Maks 5 sider.
async function renderPdfToImages(f, maxPages = 5) {
  const pdfjs = await loadPdfjs();
  const buf = new Uint8Array(await f.arrayBuffer());
  const doc = await pdfjs.getDocument({ data: buf }).promise;
  const n = Math.min(doc.numPages, maxPages);
  const imgs = [];
  for (let p = 1; p <= n; p++) {
    const page = await doc.getPage(p);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const task = page.render({ canvasContext: canvas.getContext('2d'), viewport });
    // Tidsgrense så UI-et aldri henger hvis canvas-tegning stopper opp i enkelte nettlesere.
    await Promise.race([
      task.promise,
      new Promise((_, rej) => setTimeout(() => { try { task.cancel(); } catch {} rej(new Error('rendering tok for lang tid')); }, 20000)),
    ]);
    const url = canvas.toDataURL('image/png');
    imgs.push({ name: f.name + ' (side ' + p + ')', image: url.split(',')[1], thumb: url });
  }
  return { imgs, total: doc.numPages, shown: n };
}

// Åpent vedlegg: alt slippes inn. Bilde → vision, tekst → tekst, PDF → tekst/bilde, resten → hex-oppsummering.
async function addFiles(list) {
  for (const f of list) {
    const isImg = /\.(png|jpe?g|gif|webp|bmp|avif|heic|heif|tiff?)$/i.test(f.name) || (f.type && f.type.startsWith('image/'));
    const isPdf = /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
    try {
      if (isImg) {
        if (f.size > 15 * 1024 * 1024) { alert(f.name + ' er over 15 MB.'); continue; }
        // Format Ollama leser direkte → send rått. Ellers → tegn om til PNG.
        const direkte = OLLAMA_IMG.test(f.name) || ['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'image/bmp'].includes(f.type);
        const img = direkte ? await readImage(f) : await imageFileToPng(f);
        pending.push({ name: f.name, image: img.image, thumb: img.thumb });
        continue;
      }
      if (isPdf) {
        if (f.size > 20 * 1024 * 1024) { alert(f.name + ' er over 20 MB.'); continue; }
        const text = await readPdf(f);
        if (text.replace(/--- side \d+ ---/g, '').trim()) {
          pending.push({ name: f.name, text });
        } else {
          const { imgs, total, shown } = await renderPdfToImages(f);
          imgs.forEach((im) => pending.push(im));
          if (total > shown) alert(f.name + ' har ' + total + ' sider; de første ' + shown + ' ble lagt ved som bilder.');
        }
        continue;
      }
      // Prøv som tekst (små filer). Ellers → hex-oppsummering, så modellen fortsatt får noe å jobbe med.
      if (f.size <= 2 * 1024 * 1024) {
        const text = await f.text();
        if (!text.includes('\u0000')) { pending.push({ name: f.name, text }); continue; }
      }
      pending.push({ name: f.name, text: await fileToHexSummary(f) });
    } catch (e) {
      alert('Klarte ikke å lese ' + f.name + ': ' + e.message + (isPdf ? ' Tips: ta et skjermbilde av PDF-en og legg det ved som bilde.' : ''));
    }
  }
  const total = pending.reduce((n, f) => n + (f.text ? f.text.length : 0), 0);
  if (total > CTX_CHARS) alert('Vedleggene er store og kan overstige modellens kontekstvindu. Noe innhold blir kanskje ikke lest.');
  renderPending();
}

async function send() {
  if (controller) { controller.abort(); return; } // knappen er "Stopp" mens svaret strømmer
  const text = $('input').value.trim();
  if (!text && !pending.length) return;

  const imageAtts = pending.filter((f) => f.image);
  // Vision-vakt: bilder krever en modell som kan se bilder.
  if (imageAtts.length && !visionSet.has(sel.value)) {
    alert('Modellen «' + sel.value + '» kan ikke se bilder. Bytt til en vision-modell (f.eks. qwen3.8:27b eller den abliterte) for å sende bilder.');
    return;
  }
  const textAtts = pending.filter((f) => f.text);
  const content = textAtts.map((f) => 'Vedlagt fil: ' + f.name + '\n```\n' + f.text + '\n```').join('\n\n')
    + (textAtts.length ? '\n\n' : '') + text;
  const images = imageAtts.map((f) => f.image);
  const thumbs = imageAtts.map((f) => f.thumb);
  messages.push({ role: 'user', content, text, files: pending.map((f) => f.name), images, thumbs });
  const reply = { role: 'assistant', content: '', thinking: '' };
  messages.push(reply);
  pending = []; renderPending();
  $('input').value = ''; grow();
  render();

  controller = new AbortController();
  $('send').textContent = 'Stopp';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: $('modelSelect').value || undefined, messages: messages.slice(0, -1).map((m) => (m.images && m.images.length ? { role: m.role, content: m.content, images: m.images } : { role: m.role, content: m.content })) }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'HTTP ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        if (j.message) {
          reply.thinking += j.message.thinking || '';
          reply.content += j.message.content || '';
        }
      }
      render();
    }
  } catch (e) {
    if (e.name !== 'AbortError') reply.error = 'Feil: ' + e.message;
  } finally {
    controller = null;
    $('send').textContent = 'Send';
    save(); render();
  }
}

function grow() { const t = $('input'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
$('input').addEventListener('input', grow);
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('send').onclick = send;
$('attachBtn').onclick = () => $('file').click();
$('file').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
$('newBtn').onclick = () => { if (controller) controller.abort(); messages = []; save(); render(); };
$('aboutBtn').onclick = () => $('docs').classList.add('open');
$('closeDocs').onclick = () => $('docs').classList.remove('open');

const box = $('box');
box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('drag'); });
box.addEventListener('dragleave', () => box.classList.remove('drag'));
box.addEventListener('drop', (e) => { e.preventDefault(); box.classList.remove('drag'); addFiles(e.dataTransfer.files); });

const MODEL_KEY = 'qwen-chat-model';
const sel = $('modelSelect');
function updateStatus() {
  const s = $('status');
  s.className = 'ok'; s.textContent = (sel.value || '–') + (visionSet.has(sel.value) ? ' 👁' : '');
}
sel.onchange = () => { try { localStorage.setItem(MODEL_KEY, sel.value); } catch {} updateStatus(); };

fetch('/api/health').then((r) => r.json()).then((h) => {
  const s = $('status');
  $('docModel').textContent = h.model;
  if (!h.ollama) { sel.innerHTML = '<option>–</option>'; s.className = 'bad'; s.textContent = 'Ollama kjører ikke'; return; }
  visionSet = new Set(h.vision || []);
  const models = h.models && h.models.length ? h.models : [h.model];
  let saved = null; try { saved = localStorage.getItem(MODEL_KEY); } catch {}
  const chosen = models.includes(saved) ? saved : (models.includes(h.model) ? h.model : models[0]);
  sel.innerHTML = models.map((m) => '<option' + (m === chosen ? ' selected' : '') + '>' + esc(m) + (visionSet.has(m) ? ' 👁' : '') + '</option>').join('');
  // 👁 i option-teksten ville forurenset value; sett ren value i stedet.
  [...sel.options].forEach((o) => { o.value = o.text.replace(/ 👁$/, ''); });
  updateStatus();
}).catch(() => { sel.innerHTML = '<option>–</option>'; $('status').className = 'bad'; $('status').textContent = 'server utilgjengelig'; });

render();
$('input').focus();
</script>
</body>
</html>
